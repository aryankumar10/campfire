server.port=5001

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Encryption Key (32 bytes hex = 64 characters)
encryption.key=${ENCRYPTION_KEY}

# AWS Configuration
aws.region=${AWS_REGION:us-east-2}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
aws.s3.bucket=${S3_BUCKET_NAME:campfire-attachments}